[package]
name = "polyform-app"
version = "0.1.0"
edition = "2024"

[dependencies]
polyform-core = { path = "../polyform-core" }
wgpu = "24"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
